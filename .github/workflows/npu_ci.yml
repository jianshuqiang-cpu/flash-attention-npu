name: NPU CI

# 手动 NPU CI。PR 新建/push 不会自动跑, 由仓库 Admin 通过:
#   1. Actions 页面 Run workflow (workflow_dispatch)
#   2. PR 评论 /run-npu-ci [quick|full] [ops=...]
# 触发。只有仓库 Admin 权限账号可触发。
#
# 状态检查名: NPU CI / 手动验证
# runner 标签: self-hosted, linux, arm64, npu, flash-attention-npu

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR 编号, 例如 23"
        required: true
        type: string
      ci_mode:
        description: "CI 模式"
        required: true
        type: choice
        default: quick
        options:
          - quick
          - full
      ops:
        description: "可选, 逗号分隔的算子列表 (本仓暂未实现按算子过滤, 留空即可)"
        required: false
        type: string
        default: ""
  issue_comment:
    types: [created]

concurrency:
  # 同一 PR 的同一 head commit 重复触发不会并发跑; 不同 PR / 不同 commit 各自独立
  group: npu-ci-${{ github.event.issue.number || github.event.inputs.pr_number }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: 手动验证
    runs-on: ubuntu-latest
    # issue_comment 触发时只处理 PR 上的 /run-npu-ci; workflow_dispatch 直接放行
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && startsWith(github.event.comment.body, '/run-npu-ci'))
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      ci_mode: ${{ steps.resolve.outputs.ci_mode }}
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Resolve PR / commit / mode
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.NPU_CI_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_NUMBER_INPUT: ${{ github.event.inputs.pr_number }}
          CI_MODE_INPUT: ${{ github.event.inputs.ci_mode }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            pr_number="${{ github.event.issue.number }}"
            actor="$COMMENT_USER"
          else
            pr_number="$PR_NUMBER_INPUT"
            actor="${GITHUB_ACTOR}"
          fi
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

          # 解析 ci_mode (评论: /run-npu-ci [quick|full])
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            ci_mode="quick"
            if echo "$COMMENT_BODY" | grep -Eq '/run-npu-ci[[:space:]]+full'; then ci_mode="full"; fi
            if echo "$COMMENT_BODY" | grep -Eq '/run-npu-ci[[:space:]]+quick'; then ci_mode="quick"; fi
          else
            ci_mode="$CI_MODE_INPUT"
          fi
          echo "ci_mode=$ci_mode" >> "$GITHUB_OUTPUT"

          # 拿 PR head sha
          sha="$(gh api "repos/$repo/pulls/$pr_number" --jq '.head.sha')"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "resolved pr=$pr_number sha=$sha mode=$ci_mode actor=$actor"

      - name: Check admin permission
        id: perm
        env:
          GH_TOKEN: ${{ secrets.NPU_CI_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            actor="$COMMENT_USER"
          else
            actor="${{ github.actor }}"
          fi
          perm="$(gh api "repos/$repo/collaborators/$actor/permission" --jq '.permission')"
          echo "actor=$actor permission=$perm"
          if [ "$perm" != "admin" ]; then
            echo "::error::Only repo admins can trigger NPU CI ($actor has '$perm')"
            exit 1
          fi

      - name: Check existing NPU CI status for this commit
        id: check
        env:
          GH_TOKEN: ${{ secrets.NPU_CI_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          sha="${{ steps.resolve.outputs.sha }}"
          # 取最近一条 NPU CI / 手动验证 状态
          existing="$(gh api "repos/$repo/commits/$sha/status" \
            --jq '.statuses[] | select(.context == "NPU CI / 手动验证") | .state' || true)"
          echo "existing status: ${existing:-<none>}"
          if [ "$existing" = "success" ]; then
            echo "already passed, skip" >&2
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            # pending/none/failure 都允许重跑 (手动触发语义)
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set pending status + bot comment
        if: steps.check.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.NPU_CI_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          sha="${{ steps.resolve.outputs.sha }}"
          pr_number="${{ steps.resolve.outputs.pr_number }}"
          ci_mode="${{ steps.resolve.outputs.ci_mode }}"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            actor="$COMMENT_USER"
          else
            actor="${{ github.actor }}"
          fi

          # 写 pending
          gh api --method POST "repos/$repo/statuses/$sha" \
            -f state=pending \
            -f context="NPU CI / 手动验证" \
            -f description="NPU CI 已由 @$actor 触发 ($ci_mode+example)" \
            -f target_url="$run_url" >/dev/null

          # 找已有机器人评论 (按 marker)
          marker="<!--npu-ci-bot-->"
          comment_id="$(gh api "repos/$repo/issues/$pr_number/comments" \
            --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n1 || true)"
          body="## NPU CI
          $marker
          - 触发人: @$actor
          - 模式: \`$ci_mode\` (含 Example ST)
          - PR: #$pr_number  commit: \`${sha:0:8}\`
          - 状态: 已开始
          - Actions: [$run_url]($run_url)"

          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$repo/issues/comments/$comment_id" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/$repo/issues/$pr_number/comments" -f body="$body" >/dev/null
          fi

  run:
    name: 运行 NPU CI
    needs: prepare
    if: needs.prepare.outputs.should_run == 'true'
    runs-on: [self-hosted, linux, arm64, npu, flash-attention-npu]
    timeout-minutes: 240
    env:
      CI_MODE: ${{ needs.prepare.outputs.ci_mode }}
      CI_RUN_EXAMPLE_ST: "true"
      CI_DOCKER_IMAGE: fla-npu-ci:9.1.0
      TARGET_SHA: ${{ needs.prepare.outputs.sha }}
    outputs:
      run_outcome: ${{ steps.run.outcome }}
    steps:
      - name: Debug docker network in CI environment
        run: |
          echo "=== host env ==="
          env | grep -i proxy || echo "(no proxy env)"
          echo "HOME=$HOME"
          echo "PWD=$PWD"
          echo "whoami=$(whoami)"
          echo ""
          echo "=== docker info (network) ==="
          docker info 2>&1 | grep -iE "network|proxy|runtime" | head -10
          echo ""
          echo "=== docker container network test ==="
          docker run --rm "$CI_DOCKER_IMAGE" bash -c "
            echo '--- container env ---'
            env | grep -i proxy || echo '(no proxy in container)'
            echo '--- container resolv.conf ---'
            cat /etc/resolv.conf
            echo '--- container connect test ---'
            curl -v --connect-timeout 15 https://github.com 2>&1 | head -15
            echo '--- container git clone test ---'
            cd /tmp && git clone https://github.com/${GITHUB_REPOSITORY}.git test-repo 2>&1 | head -10 && rm -rf test-repo
          "

      - name: Clone repo via docker (容器内能连 GitHub, 浅克隆+重试)
        run: |
          set -euo pipefail
          # 清空工作目录 (包括隐藏文件)
          rm -rf .[!.]* * 2>/dev/null || true
          # 宿主机 git safe.directory (后续 ls/git log 在宿主机跑)
          git config --global --add safe.directory "$PWD"
          # 用 docker 容器 clone (宿主机连不上 GitHub, 但容器可以)
          # 浅克隆 + 大 buffer + 重试, 应对网络不稳定
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e GIT_HTTP_LOW_SPEED_LIMIT=1000 \
            -e GIT_HTTP_LOW_SPEED_TIME=60 \
            "$CI_DOCKER_IMAGE" \
            bash -c '
              set -e
              git config --global --add safe.directory /workspace
              git config --global http.postBuffer 524288000
              git config --global http.lowSpeedLimit 1000
              git config --global http.lowSpeedTime 60
              # 确保目录为空 (重试时清理)
              rm -rf /workspace/.git /workspace/* /workspace/.[!.]* 2>/dev/null || true
              max_retries=5
              for i in $(seq 1 $max_retries); do
                echo "[clone] attempt $i/$max_retries (shallow clone)"
                if git clone --depth=1 https://github.com/'"${GITHUB_REPOSITORY}"'.git .; then
                  break
                fi
                if [ $i -eq $max_retries ]; then
                  echo "[clone] all retries failed"
                  exit 1
                fi
                echo "[clone] failed, retry in 15s..."
                sleep 15
                rm -rf /workspace/.git /workspace/* /workspace/.[!.]* 2>/dev/null || true
              done
              # fetch 目标 sha (unshallow 需要)
              git fetch --depth=1 origin '"$TARGET_SHA"'
              git checkout '"$TARGET_SHA"'
            '
          # 确认 clone 成功
          ls -la ci/run_ci_container.sh
          git log --oneline -1

      - name: Run NPU CI container
        id: run
        run: |
          set -euo pipefail
          bash ci/run_ci_container.sh

  finalize:
    name: 写最终状态
    needs: [prepare, run]
    if: always()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.NPU_CI_BOT_TOKEN || secrets.GITHUB_TOKEN }}
      RUN_OUTCOME: ${{ needs.run.result }}
      COMMENT_USER: ${{ github.event.comment.user.login }}
    steps:
      - name: Set final status + update bot comment
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          sha="${{ needs.prepare.outputs.sha }}"
          pr_number="${{ needs.prepare.outputs.pr_number }}"
          ci_mode="${{ needs.prepare.outputs.ci_mode }}"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            actor="$COMMENT_USER"
          else
            actor="${{ github.actor }}"
          fi

          if [ "$RUN_OUTCOME" = "success" ]; then
            state=success; desc="NPU CI 通过 ($ci_mode+example)"; status_text="通过"
          else
            state=failure; desc="NPU CI 失败 ($ci_mode+example)"; status_text="失败"
          fi
          gh api --method POST "repos/$repo/statuses/$sha" \
            -f state="$state" \
            -f context="NPU CI / 手动验证" \
            -f description="$desc" \
            -f target_url="$run_url" >/dev/null

          marker="<!--npu-ci-bot-->"
          body="## NPU CI
          $marker
          - 触发人: @$actor
          - 模式: \`$ci_mode\` (含 Example ST)
          - PR: #$pr_number  commit: \`${sha:0:8}\`
          - 状态: $status_text
          - Actions: [$run_url]($run_url)"

          comment_id="$(gh api "repos/$repo/issues/$pr_number/comments" \
            --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n1 || true)"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$repo/issues/comments/$comment_id" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/$repo/issues/$pr_number/comments" -f body="$body" >/dev/null
          fi
          [ "$RUN_OUTCOME" = "success" ] || exit 1
