<svg xmlns="http://www.w3.org/2000/svg" id="proposed-diagram" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="proposed-title proposed-desc"><title id="proposed-title">新流水 · FP8 KV 伪量化（设计）</title><desc id="proposed-desc" data-description="横向位置表示依赖阶段，不表示实际耗时。橙色为新增反量化与KV握手，两个Prepare阶段复用通道7/23。">横向位置表示依赖阶段，不表示实际耗时。橙色为新增反量化与KV握手，两个Prepare阶段复用通道7/23。</desc><style>#proposed-diagram .bg{fill:#fff}#proposed-diagram .lane{fill:#f4f7fb}#proposed-diagram .lane-alt{fill:#edf2f8}#proposed-diagram .title{font:600 23px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#12223a}#proposed-diagram .sub{font:14px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#455975}#proposed-diagram .label{font:600 15px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#233c5b}#proposed-diagram .small{font:13px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#455975}#proposed-diagram .node{fill:#e4edf9;stroke:#9ab5d8;stroke-width:1.2}#proposed-diagram .native{fill:#edf2f8;stroke:#b9c7d8;stroke-width:1.2}#proposed-diagram .new{fill:#fff0d9;stroke:#d78a18;stroke-width:1.6}#proposed-diagram .cache{fill:#eeeafa;stroke:#ac9acb;stroke-width:1.2}#proposed-diagram .node-text{font:600 15px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#193656}#proposed-diagram .node-sub{font:13px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#415873}#proposed-diagram .new-text{fill:#744500}#proposed-diagram .edge{fill:none;stroke:#607e9e;stroke-width:1.7}#proposed-diagram .edge-new{fill:none;stroke:#c1770c;stroke-width:2}#proposed-diagram .edge-cache{fill:none;stroke:#8a6ca9;stroke-width:1.7}#proposed-diagram .edge-label{font:12px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#4b6380}#proposed-diagram .hint-native{fill:#edf7f3}#proposed-diagram .hint-new{fill:#fff2dd}#proposed-diagram .hint-text{font:600 15px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#234b46}#proposed-diagram .hint-new-text{font:600 15px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#805011}#proposed-diagram .stage[data-active="false"]{opacity:.2}
</style><defs><marker id="proposed-blue-ARROW" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#607e9e"/></marker><marker id="proposed-orange-ARROW" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#c1770c"/></marker><marker id="proposed-purple-ARROW" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#8a6ca9"/></marker></defs><rect class="bg" width="1440" height="620" rx="12"/><text class="title" x="28" y="36">新流水 · FP8 KV 伪量化（设计）</text><text class="sub" x="28" y="63">Q 保持浮点；AIV 读取 FP8 + scale 并反量化；QK / P / PV / O 保持浮点路径</text><text class="small" data-round-caption="true" x="28" y="87">示例：L=5，t=2，j=t−2=0。横向位置表示依赖阶段，不表示持续时间。</text><text class="label" x="279" y="125" text-anchor="middle">K 准备 · 当前 tile</text><text class="label" x="479" y="125" text-anchor="middle">QK(t)</text><text class="label" x="679" y="125" text-anchor="middle">Softmax(t)</text><text class="label" x="879" y="125" text-anchor="middle">V 准备 · 延迟 tile</text><text class="label" x="1079" y="125" text-anchor="middle">PV(j)</text><text class="label" x="1279" y="125" text-anchor="middle">Rescale(j)</text><rect class="lane" x="18" y="145" width="1404" height="101" rx="9"/><text class="label" x="30" y="183">AIC · MTE2</text><text class="small" x="30" y="207">GM → L1 搬入</text><rect class="lane-alt" x="18" y="265" width="1404" height="101" rx="9"/><text class="label" x="30" y="303">AIC · MTE1 / Cube</text><text class="small" x="30" y="327">L1 → L0 · 矩阵乘</text><rect class="lane" x="18" y="385" width="1404" height="101" rx="9"/><text class="label" x="30" y="423">AIV0 / AIV1</text><text class="small" x="30" y="447">MTE2 · Vector · MTE3</text><text class="small" x="225" y="190">Q 的 task 级预加载保持原路径；本行的 KV 搬入由 AIV producer 承担。</text><g class="stage producer" data-stage="current"><rect class="new" x="192" y="398" width="174" height="76" rx="9"/><text class="node-text new-text" x="279" y="422" text-anchor="middle" data-template="PrepareK({t})">PrepareK(2)</text><text class="node-sub new-text" x="279" y="443" text-anchor="middle">FP8 + FP32 scale</text><text class="node-sub new-text" x="279" y="464" text-anchor="middle">GM → UB → Q_T → L1</text></g><g class="stage producer" data-stage="delayed"><rect class="new" x="792" y="398" width="174" height="76" rx="9"/><text class="node-text new-text" x="879" y="422" text-anchor="middle" data-template="PrepareV({j})">PrepareV(0)</text><text class="node-sub new-text" x="879" y="443" text-anchor="middle">FP8 + FP32 scale</text><text class="node-sub new-text" x="879" y="464" text-anchor="middle">GM → UB → Q_T → L1</text></g><g class="stage" data-stage="current"><path class="edge-new" d="M366 436 H380 V312 H392" marker-end="url(#proposed-orange-ARROW)"/><text class="edge-label" x="287" y="365" text-anchor="middle">KV ready · 7/23</text></g><g class="stage" data-stage="delayed"><path class="edge-new" d="M966 436 H980 V312 H992" marker-end="url(#proposed-orange-ARROW)"/><text class="edge-label" x="885" y="365" text-anchor="middle">KV ready · 7/23</text></g><g class="stage" data-stage="both"><path class="edge-new" d="M766 436 H790" marker-end="url(#proposed-orange-ARROW)"/></g><g class="stage math" data-stage="current"><rect class="node" x="392" y="278" width="174" height="68" rx="9"/><text class="node-text" x="479" y="302" text-anchor="middle" data-template="QK({t})">QK(2)</text><text class="node-sub" x="479" y="323" text-anchor="middle">Q_T × Q_T → FP32</text></g><g class="stage math" data-stage="current"><rect class="node" x="592" y="398" width="174" height="76" rx="9"/><text class="node-text" x="679" y="422" text-anchor="middle" data-template="Softmax({t})">Softmax(2)</text><text class="node-sub" x="679" y="443" text-anchor="middle">mask / softcap；P 为 Q_T</text></g><g class="stage math" data-stage="delayed"><rect class="node" x="992" y="278" width="174" height="68" rx="9"/><text class="node-text" x="1079" y="302" text-anchor="middle" data-template="PV({j})">PV(0)</text><text class="node-sub" x="1079" y="323" text-anchor="middle">P(Q_T) × V(Q_T) → FP32</text></g><g class="stage math" data-stage="delayed"><rect class="node" x="1192" y="398" width="174" height="76" rx="9"/><text class="node-text" x="1279" y="422" text-anchor="middle" data-template="Rescale({j})">Rescale(0)</text><text class="node-sub" x="1279" y="443" text-anchor="middle">更新 O / 可选 LSE</text></g><g class="stage cache-stage" data-stage="delayed"><rect class="cache" x="992" y="160" width="174" height="68" rx="9"/><text class="node-text" x="1079" y="184" text-anchor="middle" data-template="P({j}) 已缓存在 L1">P(0) 已缓存在 L1</text><text class="node-sub" x="1079" y="205" text-anchor="middle" data-template="来自第 {j} 轮 Softmax">来自第 0 轮 Softmax</text></g><g class="stage" data-stage="current"><path class="edge" d="M566 312 H580 V436 H592" marker-end="url(#proposed-blue-ARROW)"/><text class="edge-label" x="584" y="365" text-anchor="middle">S ready · 0/1</text></g><g class="stage" data-stage="delayed"><path class="edge-cache" d="M1079 228 V276" marker-end="url(#proposed-purple-ARROW)"/><text class="edge-label" x="1172" y="255" text-anchor="middle">P ready · 2/3/4</text></g><g class="stage" data-stage="delayed"><path class="edge" d="M1166 312 H1180 V436 H1192" marker-end="url(#proposed-blue-ARROW)"/><text class="edge-label" x="1272" y="365" text-anchor="middle">OTmp ready · 5/6</text></g><g class="stage" data-stage="current"><text class="small" x="679" y="505" text-anchor="middle" data-template="P({t}) 写入 L1，等待第 {future} 轮 PV">P(2) 写入 L1，等待第 4 轮 PV</text></g><rect class="hint-new" x="192" y="527" width="1174" height="34" rx="7"/><text class="hint-new-text" x="212" y="550">新增依赖：Softmax(t) → PrepareV(j) → PV(j)；串行 producer 会收紧原有重叠窗口。</text><text class="small" x="192" y="584">两处橙色 KV 连线复用同一条 ready/free 通道 7/23；K/V 共用 scratch，每 AIV 每条带最多 4 token。</text></svg>