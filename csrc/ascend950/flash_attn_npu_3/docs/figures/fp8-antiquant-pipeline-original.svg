</style><defs><marker id="original-blue-ARROW" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#607e9e"/></marker><marker id="original-orange-ARROW" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#c1770c"/></marker><marker id="original-purple-ARROW" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#8a6ca9"/></marker></defs><rect class="bg" width="1440" height="620" rx="12"/><text class="title" x="28" y="36">原流水 · FP16 / BF16 KV（现有源码）</text><text class="sub" x="28" y="63">Q / K / V 为 FP16 或 BF16；AIC 的 MTE2 将 K / V 直接搬入 L1</text><text class="small" data-round-caption="true" x="28" y="87">示例：L=5，t=2，j=t−2=0。横向位置表示依赖阶段，不表示持续时间。</text><text class="label" x="279" y="125" text-anchor="middle">K 准备 · 当前 tile</text><text class="label" x="479" y="125" text-anchor="middle">QK(t)</text><text class="label" x="679" y="125" text-anchor="middle">Softmax(t)</text><text class="label" x="879" y="125" text-anchor="middle">V 准备 · 延迟 tile</text><text class="label" x="1079" y="125" text-anchor="middle">PV(j)</text><text class="label" x="1279" y="125" text-anchor="middle">Rescale(j)</text><rect class="lane" x="18" y="145" width="1404" height="101" rx="9"/><text class="label" x="30" y="183">AIC · MTE2</text><text class="small" x="30" y="207">GM → L1 搬入</text><rect class="lane-alt" x="18" y="265" width="1404" height="101" rx="9"/><text class="label" x="30" y="303">AIC · MTE1 / Cube</text><text class="small" x="30" y="327">L1 → L0 · 矩阵乘</text><rect class="lane" x="18" y="385" width="1404" height="101" rx="9"/><text class="label" x="30" y="423">AIV0 / AIV1</text><text class="small" x="30" y="447">MTE2 · Vector · MTE3</text><g class="stage transfer" data-stage="current"><rect class="native" x="192" y="160" width="174" height="68" rx="9"/><text class="node-text" x="279" y="184" text-anchor="middle" data-template="LoadK({t})">LoadK(2)</text><text class="node-sub" x="279" y="205" text-anchor="middle">FP16 / BF16 · GM → L1</text></g><g class="stage transfer" data-stage="delayed"><rect class="native" x="792" y="160" width="174" height="68" rx="9"/><text class="node-text" x="879" y="184" text-anchor="middle" data-template="LoadV({j})">LoadV(0)</text><text class="node-sub" x="879" y="205" text-anchor="middle">FP16 / BF16 · GM → L1</text></g><g class="stage" data-stage="current"><path class="edge" d="M366 194 H380 V312 H392" marker-end="url(#original-blue-ARROW)"/><text class="edge-label" x="284" y="254" text-anchor="middle">AIC 内部完成依赖</text></g><g class="stage" data-stage="delayed"><path class="edge" d="M966 194 H980 V312 H992" marker-end="url(#original-blue-ARROW)"/><text class="edge-label" x="881" y="254" text-anchor="middle">AIC 内部完成依赖</text></g><g class="stage math" data-stage="current"><rect class="node" x="392" y="278" width="174" height="68" rx="9"/><text class="node-text" x="479" y="302" text-anchor="middle" data-template="QK({t})">QK(2)</text><text class="node-sub" x="479" y="323" text-anchor="middle">Q_T × Q_T → FP32</text></g><g class="stage math" data-stage="current"><rect class="node" x="592" y="398" width="174" height="76" rx="9"/><text class="node-text" x="679" y="422" text-anchor="middle" data-template="Softmax({t})">Softmax(2)</text><text class="node-sub" x="679" y="443" text-anchor="middle">mask / softcap；P 为 Q_T</text></g><g class="stage math" data-stage="delayed"><rect class="node" x="992" y="278" width="174" height="68" rx="9"/><text class="node-text" x="1079" y="302" text-anchor="middle" data-template="PV({j})">PV(0)</text><text class="node-sub" x="1079" y="323" text-anchor="middle">P(Q_T) × V(Q_T) → FP32</text></g><g class="stage math" data-stage="delayed"><rect class="node" x="1192" y="398" width="174" height="76" rx="9"/><text class="node-text" x="1279" y="422" text-anchor="middle" data-template="Rescale({j})">Rescale(0)</text><text class="node-sub" x="1279" y="443" text-anchor="middle">更新 O / 可选 LSE</text></g><g class="stage cache-stage" data-stage="delayed"><rect class="cache" x="992" y="160" width="174" height="68" rx="9"/><text class="node-text" x="1079" y="184" text-anchor="middle" data-template="P({j}) 已缓存在 L1">P(0) 已缓存在 L1</text><text class="node-sub" x="1079" y="205" text-anchor="middle" data-template="来自第 {j} 轮 Softmax">来自第 0 轮 Softmax</text></g><g class="stage" data-stage="current"><path class="edge" d="M566 312 H580 V436 H592" marker-end="url(#original-blue-ARROW)"/><text class="edge-label" x="584" y="365" text-anchor="middle">S ready · 0/1</text></g><g class="stage" data-stage="delayed"><path class="edge-cache" d="M1079 228 V276" marker-end="url(#original-purple-ARROW)"/><text class="edge-label" x="1172" y="255" text-anchor="middle">P ready · 2/3/4</text></g><g class="stage" data-stage="delayed"><path class="edge" d="M1166 312 H1180 V436 H1192" marker-end="url(#original-blue-ARROW)"/><text class="edge-label" x="1272" y="365" text-anchor="middle">OTmp ready · 5/6</text></g><g class="stage" data-stage="current"><text class="small" x="679" y="505" text-anchor="middle" data-template="P({t}) 写入 L1，等待第 {future} 轮 PV">P(2) 写入 L1，等待第 4 轮 PV</text></g><rect class="hint-native" x="192" y="527" width="1174" height="34" rx="7"/><text class="hint-text" x="212" y="550">可重叠窗口：AIC 的 PV(j) ∥ AIV 的 Softmax(t)，因为 P(j) 已在前两轮准备。</text><text class="small" x="192" y="584">既有跨核协议：S 两槽 0/1；P 三槽 2/3/4；OTmp 两槽 5/6。Q 预加载按 task 执行。</text></svg>