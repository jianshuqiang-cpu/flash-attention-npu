<svg xmlns="http://www.w3.org/2000/svg" id="original-diagram" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="original-title original-desc"><title id="original-title">原流水 · FP16 / BF16 KV（现有源码）</title><desc id="original-desc" data-description="横向位置表示依赖阶段，不表示实际耗时。PV(j)使用之前准备的P(j)，可以与本轮Softmax(t)重叠。">横向位置表示依赖阶段，不表示实际耗时。PV(j)使用之前准备的P(j)，可以与本轮Softmax(t)重叠。</desc><style>#original-diagram .bg{fill:#fff}#original-diagram .lane{fill:#f4f7fb}#original-diagram .lane-alt{fill:#edf2f8}#original-diagram .title{font:600 23px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#12223a}#original-diagram .sub{font:14px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#455975}#original-diagram .label{font:600 15px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#233c5b}#original-diagram .small{font:13px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#455975}#original-diagram .node{fill:#e4edf9;stroke:#9ab5d8;stroke-width:1.2}#original-diagram .native{fill:#edf2f8;stroke:#b9c7d8;stroke-width:1.2}#original-diagram .new{fill:#fff0d9;stroke:#d78a18;stroke-width:1.6}#original-diagram .cache{fill:#eeeafa;stroke:#ac9acb;stroke-width:1.2}#original-diagram .node-text{font:600 15px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#193656}#original-diagram .node-sub{font:13px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#415873}#original-diagram .new-text{fill:#744500}#original-diagram .edge{fill:none;stroke:#607e9e;stroke-width:1.7}#original-diagram .edge-new{fill:none;stroke:#c1770c;stroke-width:2}#original-diagram .edge-cache{fill:none;stroke:#8a6ca9;stroke-width:1.7}#original-diagram .edge-label{font:12px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#4b6380}#original-diagram .hint-native{fill:#edf7f3}#original-diagram .hint-new{fill:#fff2dd}#original-diagram .hint-text{font:600 15px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#234b46}#original-diagram .hint-new-text{font:600 15px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#805011}#original-diagram .stage[data-active="false"]{opa